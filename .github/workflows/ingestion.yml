name: SBP Electricity Ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 5 * *"

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas python-dotenv requests playwright
          playwright install --with-deps chromium

      - name: Run SBP ingestion
        env:
          SBP_API_KEY: ${{ secrets.SBP_API_KEY }}
        run: |
          python src/ingestion/download_data.py